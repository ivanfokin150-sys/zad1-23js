<!DOCTYPE html>   
<head>    
<title>Ivan Fokin</title>    
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:red;font-size:50px;"> 
<script language="JavaScript"> 
var x1_fok=prompt("x1=",""); 
var x2_fok=prompt("x2=",""); 
var a=parseFloat(x1_fok); 
var b=parseFloat(x2_fok); 
var y1_fok = 3*Math.pow(x1_fok,4/6);
var x1_fok_rad = (x1_fok*Math.PI)/180;
var y2_fok = 2*Math.cos(x1_fok_rad) + 3*Math.cos(x1_fok_rad);
var y3_fok = Math.pow(Math.pow(x1_fok,4)+2*Math.pow(x2_fok,6),1/3)*Math.abs(x1_fok - x2_fok);
document.write("x1="+x1_fok+"&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;x2="+x2_fok+"<br>");
document.write("x1_rad="+x1_fok_rad.toFixed(2)+"<br>");
document.write("y1="+y1_fok.toFixed(2)+"<br>");
document.write("y2="+y2_fok.toFixed(2)+"<br>");
document.write("y3="+y3_fok.toFixed(2)+"<br>");
</script> 
</div> 
</body> 
</html>
